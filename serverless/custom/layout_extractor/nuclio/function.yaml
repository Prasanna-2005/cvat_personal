metadata:
  name: layout-extractor
  namespace: cvat
  annotations:
    name: Layout Extractor (Paddle OCR)
    version: 2
    type: detector
    spec: |
      [
        { "id": 0, "name": "table", "type": "rectangle" },
        { "id": 1, "name": "footer", "type": "rectangle" },
        { "id": 2, "name": "figure_title", "type": "rectangle" },
        { "id": 3, "name": "header", "type": "rectangle" },
        { "id": 4, "name": "table data", "type": "rectangle" }
      ]

spec:
  description: Table & table-cell layout detection
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio
  loggerSinks:
    - level: "info"


  build:
    image: cvat.custom.layout-extractor
    baseImage: python:3.11-slim

    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir httpx[http2] Pillow tenacity
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    http:
      kind: http
      mode: async
      async:
        maxConnectionsNumber: 1000
        minConnectionsNumber: 1000

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

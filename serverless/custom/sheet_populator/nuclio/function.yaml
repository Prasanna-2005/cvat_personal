metadata:
  name: sheet-populator
  namespace: cvat
  annotations:
    name: Excel Populator (VLM)
    version: 2
    type: interactor
    min_pos_points: 0
    min_neg_points: -1
    startswith_box: true

spec:
  description: Extract Header/Extract Table/Extract Table with QC
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio
  loggerSinks:
    - level: "info"

  build:
    image: cvat.python.sheet.populator
    baseImage: python:3.11-slim

    directives:
      preCopy:
        - kind: RUN
          value: >-
            pip install uv && uv pip install --system --no-cache-dir
            requests pillow
            google-auth-oauthlib tenacity httpx[http2] tenacity
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    http:
      kind: http
      mode: async
      async:
        maxConnectionsNumber: 1000
        minConnectionsNumber: 1000

  volumes:
    - volume:
        name: sheets-creds
        secret:
          secretName: cvat-sheets-integration
      volumeMount:
        name: sheets-creds
        mountPath: /opt/nuclio/creds
        readOnly: true

  livenessProbe:
    httpGet:
      path: "/ready"
      port: 8080
    initialDelaySeconds: 60
    timeoutSeconds: 60
    periodSeconds: 60
    failureThreshold: 10

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

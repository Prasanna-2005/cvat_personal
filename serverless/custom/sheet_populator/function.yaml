metadata:
  name: sheet-populator
  namespace: cvat
  annotations:
    name: Excel Populator (VLM)
    version: 2
    type: interactor
    min_pos_points: 0
    min_neg_points: -1
    startswith_box: true

spec:
  description: Extract Header/Extract Table
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio

  build:
    image: cvat.python.sheet.populator
    baseImage: python:3.11-slim

    directives:
      preCopy:
        - kind: RUN
          value: >-
            pip install uv && uv pip install --system --no-cache-dir
            requests pillow
            google-api-python-client google-auth-httplib2 google-auth-oauthlib
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
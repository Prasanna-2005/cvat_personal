metadata:
  name: text-validator-gflash
  namespace: cvat
  annotations:
    name: Fast QC 2 (FLASH-LITE-3.1)
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: -1
    startswith_box: true
    help_message: Draw a bounding box to select a range of cells, for which this serverless fn performs validation and returns issue dictionary.

spec:
  description: Text validator, where user draws a bounding box to select a range of cells, for which this serverless fn performs validation and returns issue dictionary
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio

  build:
    image: cvat.custom.text-validator.gflash
    baseImage: python:3.11-slim

    directives:
      preCopy:
        # Install system dependencies
        - kind: RUN
          value: pip install uv && uv pip install --system --no-cache-dir \
                 Pillow==11.1.0 \
                 langchain-core==1.4.8 langchain-openai==1.3.3 \
                 rectpack==0.2.2 \
                 numpy shapely pandas mlflow-skinny[langchain]
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: ADD
          value: https://raw.githubusercontent.com/web-fonts/ttf/refs/heads/master/dejavu-sans-webfont.ttf ./opt/nuclio/font.ttf
  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
        port: 32001

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
metadata:
  name: text-validator
  namespace: cvat
  annotations:
    name: Text Validator
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: -1
    startswith_box: true
    help_message: Draw a bounding box to select a range of cells, for which this serverless fn performs validation and returns issue dictionary.

spec:
  description: Text validator, where user draws a bounding box to select a range of cells, for which this serverless fn performs validation and returns issue dictionary
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio

  build:
    image: cvat.custom.text-validator
    baseImage: python:3.11-slim

    directives:
      preCopy:
        # Install system dependencies
        - kind: RUN
          value: apt-get update && apt-get install -y fonts-dejavu-core && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir Pillow==11.1.0 python-dotenv==1.0.1 langchain-core==1.4.8 langchain-openai==1.3.3 langchain-google-genai==4.2.5 langchain==1.3.11 mlflow==3.14.0 rectpack==0.2.2 motor==3.7.1
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
        port: 32000

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume